name: 'Change Filter'
description: 'Reports change categories for Salesforce CI (code, metadata, other)'

inputs:
  base:
    description: 'Base commit/branch to compare against (auto-detected if empty)'
    required: false
    default: ''

outputs:
  code:
    description: 'true if LWC, Apex, or Trigger files changed'
    value: ${{ steps.detect.outputs.code }}
  metadata:
    description: 'true if Flows or other Salesforce metadata changed'
    value: ${{ steps.detect.outputs.metadata }}
  other:
    description: 'true if any other files changed'
    value: ${{ steps.detect.outputs.other }}
  summary:
    description: 'Human-readable summary of changes'
    value: ${{ steps.detect.outputs.summary }}
  changed_files:
    description: 'All changed files (newline-separated)'
    value: ${{ steps.detect.outputs.changed_files }}
  code_files:
    description: 'Code files that changed'
    value: ${{ steps.detect.outputs.code_files }}
  metadata_files:
    description: 'Metadata files that changed'
    value: ${{ steps.detect.outputs.metadata_files }}
  other_files:
    description: 'Other files that changed'
    value: ${{ steps.detect.outputs.other_files }}

runs:
  using: 'composite'
  steps:
    - name: Detect and categorize changes
      id: detect
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE: ${{ inputs.base }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        SHA: ${{ github.sha }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if ! RESULT="$(bash "$ACTION_PATH/scripts/detect-changes.sh")"; then
          printf '%s\n' 'Change detection failed.' >&2
          exit 1
        fi
        if ! jq -e -s 'length == 1 and (.[0] | type == "object")' <<< "$RESULT" > /dev/null; then
          printf '%s\n' 'Change detection returned invalid JSON; expected a single JSON object.' >&2
          exit 1
        fi

        write_output() {
          local name="$1" value="$2" delimiter
          delimiter="ghadelimiter_${RANDOM}_${RANDOM}_${RANDOM}"
          while [[ "$value" == *"$delimiter"* ]]; do
            delimiter="ghadelimiter_${RANDOM}_${RANDOM}_${RANDOM}"
          done
          printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_OUTPUT"
        }

        for name in code metadata other summary changed_files code_files metadata_files other_files; do
          value="$(jq -r --arg name "$name" '.[$name] | if type == "array" then join("\n") else . end' <<< "$RESULT")"
          write_output "$name" "$value"
        done

        # Also write summary to step summary
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          jq -r .summary <<< "$RESULT" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '%s\n' 'GITHUB_STEP_SUMMARY is unset or empty; skipping step summary.' >&2
        fi